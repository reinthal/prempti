[package]
name = "premptictl"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "premptictl"
path = "src/main.rs"

[features]
default = ["fido2"]
# `premptictl signoff enroll|approve|watch`: talk to a FIDO2 authenticator
# over USB HID. Needs libudev at build time on Linux (hidapi). Build with
# `--no-default-features` on hosts without it; `signoff list|deny|status`
# keep working.
fido2 = ["dep:ctap-hid-fido2"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# `premptictl audit serve`: loopback HTTP server for the audit-trail UI.
tiny_http = "0.12"
ctap-hid-fido2 = { version = "3.6", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# `process` enables `kill_process` / `test_kill_process` (safe wrappers
# around `kill(pid, sig)` and `kill(pid, 0)`).
# `termios` enables `tcgetwinsize` (safe wrapper around `ioctl(TIOCGWINSZ)`).
rustix = { version = "1", features = ["process", "termios"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
