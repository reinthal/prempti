[package]
name = "coding-agents-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coding_agent"
crate-type = ["cdylib"]

[dependencies]
falco_plugin = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
falco_event = "0.5"
crossbeam-channel = "0.5"
dashmap = "6"
tiny_http = "0.12"
anyhow = "1"
log = "0.4"
getrandom = "0.4"
sha2 = "0.10"
# LLM monitor HTTP client. rustls (pure Rust) rather than native-tls: the
# plugin is a cdylib loaded into Falco, which already links libcurl/OpenSSL;
# a second OpenSSL in the same process is asking for symbol trouble.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.2"
