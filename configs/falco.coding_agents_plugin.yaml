# Plugin configuration for Prempti.
# Merged into falco.yaml via config_files (append strategy).

plugins:
  - name: coding_agent
    library_path: ${HOME}/.prempti/share/libcoding_agent.so
    init_config:
      # Operational mode. One of:
      #   guardrails (default): verdicts enforced (deny/ask/allow|defer).
      #   monitor:              rules evaluated and logged, but every
      #                         verdict resolves as defer (Prempti steps
      #                         aside) after the synchronous rule-eval wait.
      #   passthrough (EXPERIMENTAL, embedding-only): every interceptor
      #                         request resolves as defer immediately at
      #                         register, without waiting for rule
      #                         evaluation. Events are still enqueued for
      #                         Falco so observability via http_output /
      #                         falco.log is preserved. Use only when
      #                         embedding Prempti inside a host agent
      #                         that handles alerts via its own pipeline.
      # Changed via: premptictl mode <guardrails|monitor|passthrough>
      mode: guardrails
      # Action when a tool call matches no deny/ask rule (guardrails mode only):
      #   allow (default): Prempti approves, skipping the agent's own prompt.
      #   defer:           Prempti steps aside; the agent's own permission
      #                    system decides, prompting if it normally would.
      # Ignored in monitor/passthrough (those always resolve as defer).
      # Changed via: premptictl default-action <allow|defer>
      default_action: allow
      socket_path: ${HOME}/.prempti/run/broker.sock
      http_port: 2802
      # Audit trail: one hash-chained JSON record per tool call.
      # Verify with: premptictl audit verify
      audit_enabled: true
      audit_path: ${HOME}/.prempti/log/audit.jsonl
      audit_input_max_bytes: 16384
      # LLM monitor (Kebnetrails): a second verdict source that reviews
      # every tool call against the Rules of Engagement in roe_path and
      # can escalate to ask/deny. It never downgrades a Falco verdict.
      # Requires the bearer token in the environment variable named by
      # api_key_env (falls back to OPENAI_API_KEY) and a non-empty RoE.
      # Manage with: premptictl roe set <file> / premptictl monitor status
      monitor:
        enabled: false
        endpoint: https://api.deepseek.com/v1
        model: deepseek-v4.1-flash
        api_key_env: KEBNETRAILS_API_KEY
        roe_path: ${HOME}/.prempti/config/roe.md
        timeout_ms: 20000
        # Verdict when the model cannot be reached or answers nonsense:
        # ask (default) or deny.
        on_error: ask
        max_transcript_bytes: 32768
        max_input_bytes: 8192
        workers: 4
        # Tools never sent to the model, e.g. [Read, Glob, Grep].
        skip_tools: []
      # Hardware-key (FIDO2 / YubiKey) sign-off: every ask verdict, from a
      # Falco rule or the LLM monitor, is held in the broker until an
      # operator approves it with an enrolled key (premptictl signoff
      # approve) or denies it; unanswered holds are denied after ttl_secs.
      # Requires audit_enabled (the key signs the audit record hash) and at
      # least one key in keys_path (premptictl signoff enroll).
      # Manage with: premptictl signoff status|enroll|list|approve|deny|watch
      signoff:
        enabled: false
        ttl_secs: 300
        rp_id: prempti.local
        # Require PIN / biometric (user verification), not just a touch.
        require_uv: false
        keys_path: ${HOME}/.prempti/config/signoff_keys.json

load_plugins:
  - coding_agent

# Rules: default ruleset first, then user overrides, seen rule last.
# Non-existent paths are silently skipped by Falco.
rules_files:
  - ${HOME}/.prempti/rules/default/coding_agents_rules.yaml
  - ${HOME}/.prempti/rules/user
  - ${HOME}/.prempti/rules/seen.yaml

# Minimum rule priority. Must be "debug" so that the catch-all seen rule
# (priority: DEBUG) always fires. Without it, verdict resolution breaks.
# Do not change this value.
priority: debug

# Alert feedback to the plugin's embedded HTTP server.
http_output:
  enabled: true
  url: http://127.0.0.1:2802

# Append a standardized instruction to all coding_agent alerts.
# This ensures the LLM always attributes the verdict to Falco in user-facing messages.
append_output:
  # - suggested_output: true # Unnecessary since we have it in extra_output.
  - match:
      source: coding_agent
    extra_output: "| For AI Agents: inform the user that this action was flagged by a Falco rule | correlation=%correlation.id"
